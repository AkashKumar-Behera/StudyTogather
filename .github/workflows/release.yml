name: Release & Deploy

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a version tag like v1.0.0, v1.0.1, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  # ----------------------------------------------------
  # Job 1: Build Android APK (Obfuscated) & Deploy Web to Firebase
  # ----------------------------------------------------
  build-android-and-web:
    name: Build Android APK & Deploy Web
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # 1. Build Web App
      - name: Build Web App
        run: flutter build web --release

      # 2. Deploy Web App to Firebase Hosting
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBRTC_CD5AF }}
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ github.token }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBRTC_CD5AF }}'
          channelId: live
          projectId: webrtc-cd5af

      # 3. Build Obfuscated Android APK (Compatible with all devices, minSdk 21)
      - name: Build Obfuscated Android APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk StudyTogether-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: StudyTogether-android.apk

  # ----------------------------------------------------
  # Job 2: Build iOS IPA using macOS Runner
  # ----------------------------------------------------
  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r StudyTogether-ios.ipa Payload
        shell: bash

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: StudyTogether-ios.ipa

  # ----------------------------------------------------
  # Job 3: Build Windows Single-File Installer (.exe)
  # ----------------------------------------------------
  build-windows-exe:
    name: Build Windows EXE Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --yes
        shell: powershell

      - name: Compile Inno Setup Script into Single EXE Installer
        run: |
          $isccPath = Get-ChildItem -Path "C:\Program Files*", "C:\ProgramData\chocolatey\bin" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $isccPath) {
            $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Found ISCC at: $isccPath"
          New-Item -ItemType Directory -Force -Path "build\windows\installer"
          & "$isccPath" windows/installer.iss
          Copy-Item build\windows\installer\StudyTogether-windows-installer.exe StudyTogether-windows-setup.exe
        shell: powershell

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: StudyTogether-windows-setup.exe

  # ----------------------------------------------------
  # Job 4: Publish GitHub Release with all Installable Binaries
  # ----------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-android-and-web, build-ios-ipa, build-windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: StudyTogether ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            StudyTogether-android.apk
            StudyTogether-ios.ipa
            StudyTogether-windows-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
